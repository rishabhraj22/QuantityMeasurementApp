server:
  port: 8081

spring:
  application:
    name: quantitymeasurementapp

  datasource:
    url: jdbc:h2:mem:measurementdb
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true 

# ✅ Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ✅ Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      userService:
        register-health-indicator: true
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

# ✅ Actuator (optional but useful)
management:
  endpoints:
    web:
      exposure:
        include: "*"